<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>청소홍보</title>
<style>
@font-face{font-family:Pretendard;font-weight:400;src:url(fonts/Pretendard-Regular.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:600;src:url(fonts/Pretendard-SemiBold.woff2) format("woff2")}
@font-face{font-family:Pretendard;font-weight:800;src:url(fonts/Pretendard-ExtraBold.woff2) format("woff2")}
@font-face{font-family:Anton;src:url(fonts/anton-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:BHS;src:url(fonts/black-han-sans-korean-400-normal.woff2) format("woff2");unicode-range:U+1100-11FF,U+3130-318F,U+AC00-D7AF}
:root{--bg:#f4f6f9;--ink:#111418;--sub:#6b7280;--line:#e3e6ee;--card:#fff;--blue:#5bb6e8;--blue2:#1f86c7}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Pretendard,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
header{background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.logo{display:grid;place-items:center;width:60px;height:40px;border-radius:50%;background:var(--blue);font:15px/1 BHS,sans-serif;text-align:center}
header h1{font:800 20px/1.2 Pretendard,sans-serif;margin:0;flex:1}
.gear{background:var(--bg);color:var(--ink);font-size:15px;min-height:42px;padding:0 14px}
main{padding:16px;max-width:640px;margin:0 auto}
h2{font:800 19px/1.3 Pretendard,sans-serif;margin:0 0 12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{position:relative;aspect-ratio:3/4;border:2px dashed #c9cfdd;border-radius:12px;display:grid;place-items:center;text-align:center;overflow:hidden;background:var(--bg);color:var(--sub);font-size:15px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop b{font:800 20px Pretendard,sans-serif;display:block;color:var(--ink)}
.drop input{position:absolute;inset:0;opacity:0;z-index:2}
.tag{position:absolute;left:8px;bottom:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:2px 10px;border-radius:99px;z-index:1}
.drop.after .tag{background:var(--blue);color:var(--ink)}
label{display:block;font-weight:600;font-size:15px;margin:14px 0 4px}
input[type=text],input[type=tel],input[type=password],select,textarea{width:100%;font:16px Pretendard,system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea{min-height:72px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:700 17px Pretendard,system-ui,sans-serif;min-height:48px;border-radius:12px;border:0;padding:0 18px}
button:active{transform:scale(.98)}
.go{width:100%;background:var(--ink);color:#fff;font-size:19px;min-height:58px;margin-top:16px}
.go:disabled{opacity:.5}
.ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);font-size:15px;min-height:46px}
.pri{background:var(--blue);color:var(--ink);font-size:16px;min-height:52px;flex:1}
.status{font-size:15px;color:var(--blue2);min-height:24px;margin-top:8px}
.pulse{animation:p 1.2s ease-in-out infinite}@keyframes p{50%{opacity:.5}}
.gal{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}
.gal figure{margin:0;flex:none;scroll-snap-align:start;text-align:center;font-size:13px;color:var(--sub)}
.gal canvas{display:block;height:240px;width:auto;border-radius:8px;border:1px solid var(--line);background:#fff;margin-bottom:4px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.tabs button{flex:none;background:#fff;color:var(--ink);border:1px solid var(--line);font-size:15px;min-height:44px}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.out{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:14px;min-height:140px;font-size:16px;margin-top:10px;user-select:text}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.hint{font-size:14px;color:var(--sub);margin:8px 0 0}
.sheet{position:fixed;inset:0;background:rgba(10,14,30,.5);display:flex;align-items:flex-end;z-index:10}
.sheet>div{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;z-index:20;max-width:90vw;text-align:center}
.hist{display:grid;gap:8px}
.hist button{display:flex;gap:10px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500;font-size:15px;padding:8px;min-height:64px}
.hist img{width:48px;height:60px;object-fit:cover;border-radius:6px;flex:none}
.ver{font-size:13px;color:var(--sub);text-align:center;margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="logo" id="hLogo">청소<br>전문</div>
  <h1>홍보물 만들기</h1>
  <button class="gear" id="openSet">설정</button>
</header>

<main>
  <div class="box">
    <h2>1. 사진 넣기</h2>
    <div class="pics">
      <div class="drop before"><span class="tag">청소 전</span><div><b>청소 전</b>눌러서 선택</div><img id="imgB" alt="" hidden><input type="file" accept="image/*" id="fB" aria-label="청소 전 사진"></div>
      <div class="drop after"><span class="tag">청소 후</span><div><b>청소 후</b>눌러서 선택</div><img id="imgA" alt="" hidden><input type="file" accept="image/*" id="fA" aria-label="청소 후 사진"></div>
    </div>
    <div class="row2">
      <div><label for="kind">청소 종류</label>
        <select id="kind"><option>입주청소</option><option>이사청소</option><option>거주청소</option><option>사무실 청소</option><option>매장 청소</option><option>상가 청소</option><option>학원 청소</option><option>욕실 청소</option><option>주방 청소</option><option>정기 청소</option></select></div>
      <div><label for="place">동네 (이번 현장)</label><input type="text" id="place" placeholder="예: 영통동"></div>
    </div>
    <label for="memo">한마디 메모 (선택)</label>
    <textarea id="memo" placeholder="예: 30평 아파트, 욕실 물때가 심했어요"></textarea>
    <button class="go" id="go">홍보물 만들기</button>
    <div class="status" id="st" role="status"></div>
  </div>

  <div id="res" hidden>
    <div class="box">
      <h2>2. 디자인</h2>
      <label for="title" style="margin-top:0">제목 (고치면 디자인에 바로 반영돼요)</label>
      <textarea id="title" rows="2"></textarea>
      <div class="gal" id="gal" style="margin-top:12px"></div>
    </div>
    <div class="box">
      <h2>3. 올리기</h2>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="out" id="out"></div>
      <div class="acts"><button class="pri" id="share">인스타에 올리기</button></div>
      <div class="acts"><button class="ghost" id="story">스토리로 올리기</button><button class="ghost" id="copy">글만 복사</button><button class="ghost" id="regen">다른 문구로</button></div>
      <p class="hint" id="howTo"></p>
    </div>
  </div>

  <div class="box" id="histBox" hidden>
    <h2>최근 만든 홍보물</h2>
    <div class="hist" id="hist"></div>
  </div>
</main>

<div class="sheet" id="setSheet" hidden><div>
  <h2>설정</h2>
  <div class="row2">
    <div><label for="logo1">로고 윗줄</label><input type="text" id="logo1"></div>
    <div><label for="logo2">로고 아랫줄</label><input type="text" id="logo2"></div>
  </div>
  <label for="bTel">전화번호</label><input type="tel" id="bTel">
  <label for="bSvc">서비스 (· 로 구분)</label><input type="text" id="bSvc">
  <label for="bPts">강점 (한 줄에 하나)</label><textarea id="bPts" rows="3"></textarea>
  <div class="row2">
    <div><label for="bBadge">강조 문구</label><input type="text" id="bBadge"></div>
    <div><label for="bArea">주 활동 지역</label><input type="text" id="bArea" placeholder="예: 수원 영통"></div>
  </div>
  <label for="bInsta">인스타 아이디 (선택)</label><input type="text" id="bInsta" placeholder="@아이디">
  <label for="key">AI 키 (Claude API 키)</label><input type="password" id="key" placeholder="sk-ant-..." autocomplete="off">
  <p class="hint">키가 없으면 기본 문구로 만들어져요. 키는 이 폰에만 저장돼요.</p>
  <button class="go" id="closeSet">저장하고 닫기</button>
  <button class="ghost" id="updBtn" style="width:100%;margin-top:10px">업데이트 확인</button>
  <div class="ver"><span id="ver"></span> · <span id="updSt"></span></div>
</div></div>

<div class="toast" id="toast" hidden></div>

<script src="version.js"></script>
<script src="char.js"></script>
<script src="templates.js"></script>
<script src="app.js"></script>
</body>
</html>
